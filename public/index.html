<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>WALLSPECTRUM SERVER — LIVE</title>
<style>
:root{color-scheme:dark;--bw:1px;--sp:2px;--ac:#00FF85;--ln:var(--ac);--pf-bg:#000432;--pf-bg2:#000432;--pf-ctl:#000432;--pf-line:var(--ac);--pf-line2:var(--ac);--pf-text:var(--ac);--pf-soft:var(--ac);--pf-mute:var(--ac);--pf-fill:#000432;--pf-up:#00FF85;--pf-dn:#FF3D5A;--pf-gold:var(--ac);--pf-up-rgb:0,255,133;--pf-dn-rgb:255,61,90;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;background:#000432;color:var(--pf-text);font-family:'Roboto Mono',monospace;overflow:hidden;user-select:none;-webkit-user-select:none;}
#main-container{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,622fr) minmax(0,254fr);gap:3px;padding:3px;overflow:hidden;position:relative;background:#000432;}
body.tc-solo #main-container{grid-template-rows:1fr 0px;gap:0;}
body.tc-solo #wall-finder-pane{display:none!important;}
.pillFrame{position:absolute;z-index:20;pointer-events:none;display:none;border:var(--bw) solid;border-radius:10px;}
#pillBuy{border-color:var(--pf-up);}
#pillSell{border-color:var(--pf-dn);}
#canvas-viewport{border-color:transparent!important;background:var(--pf-bg);grid-column:1;grid-row:1;position:relative;overflow:hidden;touch-action:none;border-radius:10px;}
.table-col::after{border-color:transparent!important;}
#rangePill{--ac:#00E5FF;--ln:#00E5FF;}
.table-col{border-top:var(--bw) solid var(--ln)!important;border-radius:0 0 10px 10px!important;}
#tcWrap{position:absolute;inset:0;z-index:6;background:var(--pf-bg);border-radius:0;touch-action:none;overflow:hidden;}
#tcCanvas{display:block;position:absolute;top:0;left:0;touch-action:none;}
#tradeCard{position:absolute;left:14px;top:12px;z-index:8;display:none;flex-direction:column;gap:4px;pointer-events:none;font:700 11px 'Roboto Mono',monospace;}
.tcRow{display:flex;align-items:center;gap:10px;padding:4px 12px;border-radius:8px;background:var(--pf-fill);border:1px solid var(--pf-line2);color:var(--pf-text);font-weight:600;white-space:nowrap;}
.tcRow b[style*="00B85A" i]{background:#000432;color:var(--pf-up)!important;border:1px solid var(--pf-up);padding:1px 6px;border-radius:4px;}
.tcRow b[style*="DC2640" i]{background:#000432;color:var(--pf-dn)!important;border:1px solid var(--pf-dn);padding:1px 6px;border-radius:4px;}
#wall-finder-pane{grid-column:1;grid-row:2;padding:0;display:flex;flex-direction:column;gap:3px;overflow:hidden;z-index:10;background:var(--pf-bg);}
.tables-split{display:flex;flex:1;min-height:0;overflow:hidden;gap:3px;padding:0;}
.table-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative;background:var(--pf-bg2);border:0;border-radius:10px;padding:0;}
.table-col:first-child{--ac:var(--pf-up);--ln:var(--pf-up);}
.table-col:last-child{--ac:var(--pf-dn);--ln:var(--pf-dn);}
.table-wrapper{flex:1;overflow-y:auto;scrollbar-width:none;}
.table-wrapper::-webkit-scrollbar{display:none;}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px;font-variant-numeric:tabular-nums;}
td{height:23px;padding:1px 6px;font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:clip;vertical-align:middle;color:var(--ac);}
td:first-child{padding-left:14px!important;line-height:1.2;}
td[colspan]{color:var(--pf-mute)!important;letter-spacing:.18em;}
tr.highlight-gem{cursor:default;}
body.vm-all tr.highlight-gem{cursor:pointer;}
body.vm-all tr.row-green:hover>td{background:rgba(var(--pf-up-rgb),.10);}
body.vm-all tr.row-red:hover>td{background:rgba(var(--pf-dn-rgb),.10);}
tr.row-green>td,tr.row-red>td{border:none;background:transparent;}
tr.row-green>td{color:var(--pf-up);}
tr.row-red>td{color:var(--pf-dn);}
tr.highlight-gem>td{border-bottom:1px solid var(--ac);}
tr.highlight-gem>td+td{border-left:1px solid var(--ac);}
tr.row-green>td:first-child,tr.row-red>td:first-child{font-weight:700;}
tr.row-green>td:last-child,tr.row-red>td:last-child{font-weight:800;}
tr.highlight-gem>td:nth-child(4){font-weight:700;}
tr.highlight-gem[data-sel="1"]>td:first-child{border-left:0!important;box-shadow:inset 5px 0 0 var(--ac)!important;}
tr.highlight-gem[data-wpe][data-wph="1"]>td:nth-child(4){position:relative;color:transparent!important;}
tr.highlight-gem[data-wpe][data-wph="1"]>td:nth-child(4)::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.06em;}
tr.row-green[data-wph="1"]>td:nth-child(4)::after{color:var(--pf-up);}
tr.row-red[data-wph="1"]>td:nth-child(4)::after{color:var(--pf-dn);}
tr.highlight-gem[data-wpe="WARN"][data-wph="1"]>td:nth-child(4)::after{content:"HIT SOON";}
tr.highlight-gem[data-wpe="HIT"][data-wph="1"]>td:nth-child(4)::after{content:"HIT";}
tr.highlight-gem[data-wpe="MISS"][data-wph="1"]>td:nth-child(4)::after{content:"MISSED";}
td:first-child .pyP{color:inherit!important;display:inline;margin-left:2px;font-size:inherit;font-weight:inherit;}
#rangePill{--ac:#A855F7;--ln:#A855F7;flex-shrink:0;display:flex;flex-wrap:nowrap;align-items:stretch;justify-content:stretch;gap:0;margin-top:0;padding:0;height:30px;background:var(--pf-bg2);border:var(--bw) solid var(--ln);border-radius:10px;overflow:hidden;font:700 11px 'Roboto Mono',monospace;white-space:nowrap;}
#tradePill{display:flex;flex:1 1 0;flex-wrap:nowrap;align-items:stretch;justify-content:stretch;gap:0;width:100%;min-width:0;height:28px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;font:700 11px 'Roboto Mono',monospace;white-space:nowrap;}
#tradePill::-webkit-scrollbar{display:none;}
#tradePill.ucReordering{touch-action:none;cursor:grabbing;}
#tradePill>*{flex:1 1 0;min-width:0;width:0;height:28px;padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:clip;text-align:center;background:#000432;border:none;color:var(--ac);font:700 clamp(9px,.78vw,11px) 'Roboto Mono',monospace;letter-spacing:.02em;outline:none;cursor:pointer;box-shadow:inset -1px 0 0 var(--ac);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#tradePill>*:last-child{box-shadow:none;}
#tradePill>.ucBtn:hover,#tradePill>.ucSel:hover{background:rgba(168,85,247,.14);}
#tradePill>.ucSel{appearance:none;-webkit-appearance:none;text-align-last:center;}
#tradePill>.ucSel option{background:#000432;color:var(--ac);font-weight:700;}
#tradePill>.ucIn{background:rgba(168,85,247,.20);color:var(--ac);caret-color:var(--ac);-webkit-text-fill-color:var(--ac);user-select:text;-webkit-user-select:text;cursor:text;box-shadow:inset 0 0 0 1px var(--ac),inset -1px 0 0 var(--ac);}
#tradePill>.ucIn:last-child{box-shadow:inset 0 0 0 1px var(--ac);}
#tradePill>.ucIn::-webkit-outer-spin-button,#tradePill>.ucIn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
#tradePill>.ucBtn.on{background:var(--ac);color:#000432;}
#tradePill>.ucBtn.vmBtn{color:#00FF85;}
#tradePill>.ucBtn.vmBtn.vm-MTL{color:#FFD400;}
#tradePill>.ucBtn.vmBtn.vm-ALL{color:#A855F7;}
#tradePill>.ucBtn.lgSyncOk{color:#00FF85;}
#tradePill>.ucBtn.lgSyncWarn{color:#FFD400;}
#tradePill>.ucBtn.lgSyncDown{color:#FF3D5A;}
#tradePill>.ucBtn.ucErr{background:#FF3D5A;color:#000432;}
#tradePill>.ucBtn.ucDrag{background:#FFD400;color:#000432;cursor:grabbing;box-shadow:inset 0 0 0 1px #FFD400;}
@media(max-width:760px){
  #tradePill>*{flex:0 0 64px;width:64px;min-width:64px;font-size:10px;}
}
@keyframes psIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
#logPanel{display:none;position:fixed;inset:10px 10px 44px 10px;z-index:9000;flex-direction:column;background:#000432;border:var(--bw) solid var(--ac);border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,2,20,.78);overflow:hidden;color:var(--ac);font:600 11px 'Roboto Mono',monospace;}
#logPanel.open{display:flex;animation:psIn .12s ease-out;}
#logPanel .lpTop{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ac);background:#000432;}
#logPanel .lpTitle{font-size:12px;font-weight:800;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#logPanel .lpTopR{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
#logPanel .lpPill{padding:2px 8px;border:1px solid var(--ac);border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap;}
#logPanel .lpPill.up{border-color:var(--pf-up);color:var(--pf-up);}
#logPanel .lpPill.dn{border-color:var(--pf-dn);color:var(--pf-dn);}
#logPanel .lpBtn{height:22px;padding:0 8px;background:#000432;border:1px solid var(--ac);border-radius:6px;color:var(--ac);font:700 10px 'Roboto Mono',monospace;letter-spacing:.06em;cursor:pointer;outline:none;}
#logPanel .lpBtn.on{background:var(--ac);color:#000432;}
#logPanel .lpBtn.dn{border-color:var(--pf-dn);color:var(--pf-dn);}
#logPanel .lpSummary{flex:0 0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:4px;padding:8px 12px;border-bottom:1px solid var(--ac);}
#logPanel .lpKv{padding:5px 7px;border:1px solid var(--ac);border-radius:6px;display:flex;flex-direction:column;gap:2px;min-width:0;}
#logPanel .lpK{font-size:9px;letter-spacing:.1em;opacity:.72;white-space:nowrap;}
#logPanel .lpV{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#logPanel .lpLocks{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 12px;border-bottom:1px solid var(--ac);}
#logPanel .lpLock{padding:6px 8px;border:1px solid var(--ac);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
#logPanel .lpLock.up{border-color:var(--pf-up);color:var(--pf-up);}
#logPanel .lpLock.dn{border-color:var(--pf-dn);color:var(--pf-dn);}
#logPanel .lpMain{flex:1 1 0;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);overflow:hidden;}
#logPanel .lpSec{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
#logPanel .lpSec+.lpSec{border-left:1px solid var(--ac);}
#logPanel .lpSecH{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-bottom:1px solid var(--ac);font-size:10px;font-weight:800;letter-spacing:.1em;}
#logPanel .lpSecB{flex:1 1 0;min-height:0;overflow-y:auto;scrollbar-width:none;padding:4px 10px 8px;}
#logPanel .lpSecB::-webkit-scrollbar{display:none;}
#logPanel .lpRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(0,255,133,.22);font-variant-numeric:tabular-nums;}
#logPanel .lpRow.up{color:var(--pf-up);}
#logPanel .lpRow.dn{color:var(--pf-dn);}
#logPanel .lpEv{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid rgba(0,255,133,.22);line-height:1.35;}
#logPanel .lpEvT{flex:0 0 auto;opacity:.75;font-variant-numeric:tabular-nums;}
#logPanel .lpEvC{flex:0 0 auto;padding:0 5px;border:1px solid currentColor;border-radius:4px;font-size:9px;font-weight:800;}
#logPanel .lpEvM{flex:1 1 0;min-width:0;white-space:pre-wrap;word-break:break-word;}
#logPanel .lpEv.up{color:var(--pf-up);}
#logPanel .lpEv.dn{color:var(--pf-dn);}
#logPanel .lpEmpty{padding:18px 8px;text-align:center;opacity:.65;letter-spacing:.12em;}
#logPanel .lpSyncRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid rgba(0,255,133,.22);font-variant-numeric:tabular-nums;white-space:nowrap;}
#logPanel .lpSyncRow.up{color:var(--pf-up);}
#logPanel .lpSyncRow.dn{color:var(--pf-dn);}
#logPanel .lpSyncRow.wrap{white-space:normal;flex-wrap:wrap;}
#logPanel .lpSyncRow span:last-child{overflow:hidden;text-overflow:ellipsis;text-align:right;}
#logPanel .lpSyncRow.wrap span:last-child{text-align:left;}
#logPanel .lpSyncH{padding:8px 0 3px;font-size:10px;font-weight:800;letter-spacing:.1em;border-bottom:1px solid var(--ac);}
#logPanel .lpSyncG{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px;padding:4px 0;}
#logPanel .lpBar{flex:0 0 auto;display:flex;align-items:stretch;height:34px;margin:6px 10px 8px;border:1px solid var(--ac);border-radius:10px;overflow:hidden;background:#000432;}
#logPanel .lpBar .lpBtn{flex:1 1 0;min-width:0;height:auto;padding:0 6px;border:0;border-left:1px solid var(--ac);border-radius:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;}
#logPanel .lpBar .lpBtn:first-child{border-left:0;}
#logPanel .lpBar .lpBtn.dn{border:0;border-left:1px solid var(--ac);}
#logPanel .lpBar .lpBtn[data-lf="ERR"]{color:var(--pf-dn);}
#logPanel .lpBar .lpBtn[data-lf="SYS"]{color:#FFD400;}
#logPanel .lpBar .lpBtn[data-lf="ERR"].on{background:var(--pf-dn);color:#000432;}
#logPanel .lpBar .lpBtn[data-lf="SYS"].on{background:#FFD400;color:#000432;}
#logPanel .lpBadge{padding:0 5px;border:1px solid currentColor;border-radius:8px;font-size:9px;font-weight:800;line-height:14px;font-variant-numeric:tabular-nums;}
#logPanel .lpTop,#logPanel .lpSummary,#logPanel .lpLocks,#logPanel .lpSecH{display:none;}
#logPanel .lpSettings,#logPanel .lpEditor{display:none;}
#logPanel .lpKv.ed{cursor:pointer;position:relative;transition:background .12s,box-shadow .12s;}
#logPanel .lpKv.ed:hover{background:rgba(0,255,133,.08);}
#logPanel .lpKv.ed.editing{background:rgba(0,255,133,.16);box-shadow:inset 0 0 0 1px var(--ac);}
#logPanel .lpKv.ed .lpK{display:flex;align-items:center;justify-content:space-between;gap:4px;}
#logPanel .lpKv.ed .lpK::after{content:"EDIT";font-size:8px;letter-spacing:.08em;opacity:.85;}
#logPanel[data-view="INFO"] .lpTop{display:block;padding:8px 12px 0;border-bottom:0;}
#logPanel[data-view="INFO"] .lpTopR{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;width:100%;}
#logPanel[data-view="INFO"] .lpTopR>*{min-width:0;height:40px;padding:0 7px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#logPanel[data-view="INFO"] .lpSummary{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));padding:4px 12px 6px;border-bottom:0;}
#logPanel[data-view="INFO"] .lpSettings{display:grid;flex:1 1 0;min-height:0;overflow-y:auto;scrollbar-width:none;align-content:start;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;padding:0 12px 8px;}
#logPanel[data-view="INFO"] .lpSettings::-webkit-scrollbar{display:none;}
#logPanel[data-view="INFO"] .lpEditor.open{display:flex;flex:0 0 auto;flex-wrap:wrap;align-items:center;gap:6px;margin:0 12px 6px;padding:7px 10px;border:1px solid #FFD400;border-radius:8px;background:#000432;color:#FFD400;}
#logPanel .lpEdLbl{font-size:10px;font-weight:800;letter-spacing:.08em;white-space:nowrap;}
#logPanel .lpEdIn,#logPanel .lpEdSel{height:26px;min-width:74px;max-width:130px;padding:0 8px;background:#000432;border:1px solid var(--ac);border-radius:6px;color:var(--ac);font:700 11px 'Roboto Mono',monospace;outline:none;}
#logPanel .lpEdMsg{font-size:10px;font-weight:700;letter-spacing:.05em;margin-left:auto;}
#logPanel .lpEdMsg.err{color:var(--pf-dn);}
#logPanel .lpEdMsg.ok{color:var(--pf-up);}
#logPanel[data-view="INFO"] .lpMain{display:none;}
@media(max-width:760px){
  #logPanel[data-view="INFO"] .lpTopR,#logPanel[data-view="INFO"] .lpSummary,#logPanel[data-view="INFO"] .lpSettings{grid-template-columns:repeat(3,minmax(0,1fr));}
}
#logPanel[data-view="INFO"] .lpSecB{display:none;}
#logPanel .lpTitle,#logPanel .lpBtn[data-lp="close"]{display:none;}
#logPanel .lpBar .lpBtn[data-lf="INFO"]{color:var(--ac);}
#logPanel .lpBar .lpBtn[data-lf="INFO"].on{color:#000432;}
#bootOverlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:#000432;}
#bootOverlay>div:first-child{width:min(540px,94vw);text-align:center;font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--ac);background:#000432;border:1px solid var(--ac);padding:6px 12px;border-radius:10px;}
#bootLogBox{width:min(540px,94vw);height:150px;padding:10px;overflow-y:auto;background:#000432;border:1px solid var(--ac);border-radius:10px;color:var(--ac);font-size:10px;line-height:1.5;scrollbar-width:none;}
#bootLogBox::-webkit-scrollbar{display:none;}
@media(max-width:760px){
  #logPanel{inset:6px 6px 44px 6px;}
  #logPanel .lpMain{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);}
  #logPanel .lpSec+.lpSec{border-left:0;border-top:1px solid var(--ac);}
  #logPanel .lpLocks{grid-template-columns:1fr;}
}
@media(max-width:600px){
  #main-container{padding:3px;gap:3px;}
  .tables-split{gap:3px;}
  td:first-child{padding-left:8px!important;}
}
@media(orientation:portrait){
  #main-container{grid-template-rows:minmax(0,576fr) minmax(0,300fr);}
  #tradeCard{left:8px;right:8px;top:8px;}
  .tcRow{gap:6px;padding:3px 8px;font-size:11px;overflow:hidden;}
  td{height:23px;padding:1px 4px;font-size:11px;}
  table{font-size:11px;}
}
</style>
</head>
<body>
  <div id="main-container">
    <div id="canvas-viewport">
      <div id="tcWrap">
        <canvas id="tcCanvas"></canvas>
      </div>
      <div id="tradeCard"></div>
    </div>
    <div id="wall-finder-pane">
      <div class="tables-split">
        <div class="table-col">
          <div class="table-wrapper"><table><tbody id="peaksTableBodyRev"></tbody></table></div>
        </div>
        <div class="table-col">
          <div class="table-wrapper"><table><tbody id="peaksTableBodyMom"></tbody></table></div>

        </div>
      </div>
    </div>
  </div>
  <div id="bootOverlay">
    <div>⬡ WALLSPECTRUM SERVER ENGINE (CONNECTING...)</div>
    <div id="bootLogBox"><div id="bootLogLines"></div></div>
  </div>
<script>
// If hosted directly on Render, use same origin; otherwise point to your Render server URL
var TICK_SERVER = (/^https?:/.test(location.protocol) && !/github\.io|localhost|127\.0\.0\.1/i.test(location.hostname))
  ? location.origin
  : "https://tck-iy0g.onrender.com";

var DRV_PAIRS = ["1HZ10V", "1HZ15V", "1HZ25V", "1HZ30V", "1HZ50V", "1HZ75V", "1HZ90V", "1HZ100V"];
var MTL_PAIRS = ["frxXAUUSD", "frxXAGUSD"];
var ALL_PAIRS = DRV_PAIRS.concat(MTL_PAIRS, [
  "frxAUDCAD", "frxAUDCHF", "frxAUDJPY", "frxAUDNZD", "frxAUDUSD",
  "cryBTCUSD", "cryETHUSD",
  "frxEURAUD", "frxEURCAD", "frxEURCHF", "frxEURGBP", "frxEURJPY", "frxEURNZD", "frxEURUSD",
  "frxGBPAUD", "frxGBPCAD", "frxGBPCHF", "frxGBPJPY", "frxGBPNZD", "frxGBPUSD",
  "frxNZDJPY", "frxNZDUSD",
  "frxUSDCAD", "frxUSDCHF", "frxUSDJPY", "frxUSDMXN",
  "frxXPTUSD"
]);
var _viewModes = ["ALL"];
var _viewMode = "ALL";
if (document.body) document.body.classList.add("vm-all");
var _allView = { buy: null, sell: null };
var PRE_ROLL_SECS = 900;
var currentStartTsUtc = Math.floor(Date.now() / 1000) - (Math.floor(Date.now() / 1000) % 86400);
var CYCLE = 132, _ssMin = 60, _ssSel = 1;
var allPairData = {};
var _lmx = {}, _preRoll = {}, _srvBp = {}, _srvFp = {};
var srvState = {
  feedState: "CONNECTING",
  wsConnected: false,
  backfill: { active: true, pct: 0 },
  pairs: DRV_PAIRS,

    var pctVal = Number(_ucVal("lockMinPct"));
    if (!Number.isFinite(pctVal)) pctVal = (sc.lockMinPct !== undefined && sc.lockMinPct !== null) ? +sc.lockMinPct : 60;
    var c1Val = Number(_ucVal("lockMinC1"));
    if (!Number.isFinite(c1Val)) c1Val = (sc.lockMinC1 !== undefined && sc.lockMinC1 !== null) ? +sc.lockMinC1 : 10;
    var r0On = !!_ucVal("r0Only");
    var topVal = Number(_ucVal("topLimit")) || sc.topLimit || (_viewMode === "ALL" ? 37 : 16);
    var autoOn = !!tg.auto;

    var itemMap = {
      vmode: '<button type="button" class="ucBtn vmBtn vm-' + _esc(_viewMode) + '" data-uc-id="vmode" data-uc-act="vmode" title="Click: Switch DRV / MTL / ALL | Hold: Move">' + _esc(_viewMode) + '</button>',
      bal: '<button type="button" id="tpBal" class="ucBtn" data-uc-id="bal" data-uc-act="mode" title="Click: Demo/Real | Hold: Move">' + _esc(balTxt) + '</button>',
      log: '<button type="button" id="logBtn" class="ucBtn ' + logInfo.cls + '" data-uc-id="log" data-uc-act="log" title="' + _esc(logInfo.title) + '">' + _esc(logInfo.txt) + '</button>',
      minC: '<button type="button" class="ucBtn' + (_ucErrKey === "minC" ? " ucErr" : "") + '" data-uc-id="minC" data-uc-key="minC" title="Click: Edit Min Cycle | Hold: Move">C' + minC + '</button>',
      maxC: '<button type="button" class="ucBtn' + (_ucErrKey === "maxC" ? " ucErr" : "") + '" data-uc-id="maxC" data-uc-key="maxC" title="Click: Edit Max Cycle | Hold: Move">C' + maxC + '</button>',
      scanInt: '<button type="button" class="ucBtn' + (_ucErrKey === "scanInt" ? " ucErr" : "") + '" data-uc-id="scanInt" data-uc-key="scanInt" title="Click: Edit Scan Int | Hold: Move">' + scanInt + 's</button>',
      ssMin: '<button type="button" class="ucBtn' + (_ucErrKey === "ssMin" ? " ucErr" : "") + '" data-uc-id="ssMin" data-uc-sel="ssMin" title="Click: Select Session | Hold: Move">' + _esc(ssTxt) + '</button>',
      lvl: '<button type="button" class="ucBtn' + (_ucErrKey === "lvl" ? " ucErr" : "") + '" data-uc-id="lvl" data-uc-key="lvl" title="Click: Edit Level (0=ALL) | Hold: Move">' + _esc(lvlTxt) + '</button>',
      stake: '<button type="button" class="ucBtn' + (_ucErrKey === "stake" ? " ucErr" : "") + '" data-uc-id="stake" data-uc-key="stake" title="Click: Edit Stake | Hold: Move">$' + stakeVal.toFixed(2) + '</button>',
      lockMinPct: '<button type="button" class="ucBtn' + (_ucErrKey === "lockMinPct" ? " ucErr" : "") + '" data-uc-id="lockMinPct" data-uc-key="lockMinPct" title="Click: Edit Lock Min % | Hold: Move">' + pctVal + '%</button>',
      lockMinC1: '<button type="button" class="ucBtn' + (_ucErrKey === "lockMinC1" ? " ucErr" : "") + '" data-uc-id="lockMinC1" data-uc-key="lockMinC1" title="Click: Edit Lock Min C1 | Hold: Move">C1:' + c1Val + '</button>',
      r0Only: '<button type="button" class="ucBtn' + (r0On ? " on" : "") + '" data-uc-id="r0Only" data-uc-bool="r0Only" title="Click: Toggle R0 | Hold: Move">R0</button>',
      topLimit: '<button type="button" class="ucBtn' + (_ucErrKey === "topLimit" ? " ucErr" : "") + '" data-uc-id="topLimit" data-uc-key="topLimit" title="Click: Edit Top Limit | Hold: Move">T' + topVal + '</button>',
      rescan: '<button type="button" id="ucScanBtn" class="ucBtn" data-uc-id="rescan" data-uc-act="rescan" title="Click: Rescan Now | Hold: Move">' + _esc(scanTxt) + '</button>',
      auto: '<button type="button" class="ucBtn' + (autoOn ? " on" : "") + '" data-uc-id="auto" data-uc-act="auto" title="Click: Enable/Disable ' + _esc(_viewMode) + ' Trading | Hold: Move">' + (autoOn ? "ON" : "OFF") + '</button>'
    };

    var extraSchema = _curSchema().filter(function (f) {
      return f && f.editable !== false && !_ucBuiltIn[f.key];
    });
    for (var ei = 0; ei < extraSchema.length; ei++) {
      var ef = extraSchema[ei];
      var ev = _ucVal(ef.key);
      if (ef.type === "bool") {
        itemMap[ef.key] = '<button type="button" class="ucBtn' + (ev ? " on" : "") + '" data-uc-id="' + _esc(ef.key) + '" data-uc-bool="' + _esc(ef.key) + '" title="Click: Toggle ' + _esc(ef.label) + ' | Hold: Move">' + _esc(ef.label) + '</button>';
      } else if (ef.type === "select" && Array.isArray(ef.options) && ef.options.length) {
        itemMap[ef.key] = '<button type="button" class="ucBtn' + (_ucErrKey === ef.key ? " ucErr" : "") + '" data-uc-id="' + _esc(ef.key) + '" data-uc-sel="' + _esc(ef.key) + '" title="Click: Select ' + _esc(ef.label) + ' | Hold: Move">' + _esc(_ucFmt(ef, ev)) + '</button>';
      } else {
        itemMap[ef.key] = '<button type="button" class="ucBtn' + (_ucErrKey === ef.key ? " ucErr" : "") + '" data-uc-id="' + _esc(ef.key) + '" data-uc-key="' + _esc(ef.key) + '" title="Click: Edit ' + _esc(ef.label) + ' | Hold: Move">' + _esc(_ucFmt(ef, ev)) + '</button>';
      }
    }

    var ordered = _ucOrderedIds(itemMap);
    var structSig = _viewMode + "|" + ordered.join(",") + "|" + minC + "|" + maxC + "|" + scanInt + "|" + ssMin + "|" + lvlVal + "|" + stakeVal.toFixed(2) + "|" + pctVal + "|" + c1Val + "|" + (r0On ? 1 : 0) + "|" + topVal + "|" + (autoOn ? 1 : 0) + "|" + (_ucErrKey || "") + "|" + extraSchema.map(function (f) { return f.key + "=" + _ucVal(f.key); }).join(",");

    if (structSig !== _ucSig) {
      _ucSig = structSig;
      pillEl.innerHTML = ordered.map(function (id) { return itemMap[id]; }).join("");
    } else {
      var b1 = document.getElementById("tpBal");
      if (b1 && b1.textContent !== balTxt) b1.textContent = balTxt;
      var s1 = document.getElementById("ucScanBtn");
      if (s1 && s1.textContent !== scanTxt) s1.textContent = scanTxt;
      _ucApplyLogBtn(document.getElementById("logBtn"), logInfo);
    }
  }

  var pillEl = document.getElementById("tradePill");
  if (pillEl) {
    pillEl.addEventListener("contextmenu", function (ev) {
      if (ev.target && ev.target.closest && ev.target.closest("button[data-uc-id]")) {
        ev.preventDefault();
      }
    });

    pillEl.addEventListener("pointerdown", function (ev) {
      if (ev.button && ev.button !== 0) return;
      var b = ev.target && ev.target.closest ? ev.target.closest("button[data-uc-id]") : null;
      if (!b || _ucHasActiveEdit(pillEl)) return;
      if (_ucHold) clearTimeout(_ucHold.timer);
      _ucHold = {
        id: b.getAttribute("data-uc-id"),
        btn: b,
        pid: ev.pointerId,
        x0: ev.clientX,
        y0: ev.clientY,
        timer: setTimeout(function () {
          if (!_ucHold || _ucHold.btn !== b || !b.isConnected) return;
          _ucDrag = { id: _ucHold.id, btn: b, pid: _ucHold.pid };
          _ucHold = null;
          b.classList.add("ucDrag");
          pillEl.classList.add("ucReordering");
          try { pillEl.setPointerCapture(_ucDrag.pid); } catch (e) {}
          try { if (navigator.vibrate) navigator.vibrate(18); } catch (e) {}
        }, 260)
      };
    });

    var _ucMoveDrag = function (ev) {
      if (_ucHold && ev.pointerId === _ucHold.pid) {
        if (Math.hypot(ev.clientX - _ucHold.x0, ev.clientY - _ucHold.y0) > 10) {
          clearTimeout(_ucHold.timer);
          _ucHold = null;
        }
        return;
      }
      if (!_ucDrag || ev.pointerId !== _ucDrag.pid) return;
      if (ev.cancelable) ev.preventDefault();
      var pr = pillEl.getBoundingClientRect();
      if (ev.clientX < pr.left + 24) pillEl.scrollLeft -= 10;
      else if (ev.clientX > pr.right - 24) pillEl.scrollLeft += 10;

      var items = Array.prototype.slice.call(pillEl.querySelectorAll("[data-uc-id]"));
      if (items.length < 2) return;
      var curIdx = items.indexOf(_ucDrag.btn);
      if (curIdx < 0) return;
      var targetIdx = -1;
      var rFirst = items[0].getBoundingClientRect();
      var rLast = items[items.length - 1].getBoundingClientRect();
      if (ev.clientX <= rFirst.left) targetIdx = 0;
      else if (ev.clientX >= rLast.right) targetIdx = items.length - 1;
      else {
        for (var i = 0; i < items.length; i++) {
          var rc = items[i].getBoundingClientRect();
          if (ev.clientX >= rc.left && ev.clientX <= rc.right) { targetIdx = i; break; }
        }
      }
      if (targetIdx >= 0 && targetIdx !== curIdx) {
        if (targetIdx < curIdx) pillEl.insertBefore(_ucDrag.btn, items[targetIdx]);
        else pillEl.insertBefore(_ucDrag.btn, items[targetIdx].nextSibling);
        _ucOrder = Array.prototype.slice.call(pillEl.querySelectorAll("[data-uc-id]")).map(function (el) {
          return el.getAttribute("data-uc-id");
        });
        _ucSaveOrder();
      }
    };

    var _ucEndDrag = function (ev) {
      if (_ucHold && ev.pointerId === _ucHold.pid) {
        clearTimeout(_ucHold.timer);
        _ucHold = null;
      }
      if (!_ucDrag || ev.pointerId !== _ucDrag.pid) return;
      _ucDrag.btn.classList.remove("ucDrag");
      pillEl.classList.remove("ucReordering");
      try { pillEl.releasePointerCapture(_ucDrag.pid); } catch (e) {}
      _ucDrag = null;
      _ucSuppressClickUntil = Date.now() + 350;
      _ucSig = "";
      _ucRender();
    };

    document.addEventListener("pointermove", _ucMoveDrag, { passive: false });
    document.addEventListener("pointerup", _ucEndDrag);
    document.addEventListener("pointercancel", _ucEndDrag);

    pillEl.addEventListener("click", function (ev) {
      if (Date.now() < _ucSuppressClickUntil) {
        ev.preventDefault();
        ev.stopPropagation();
        return;
      }
      var b = ev.target && ev.target.closest ? ev.target.closest("button[data-uc-id]") : null;
      if (!b) return;
      var key = b.getAttribute("data-uc-key");
      var selKey = b.getAttribute("data-uc-sel");
      var boolKey = b.getAttribute("data-uc-bool");
      var act = b.getAttribute("data-uc-act");
      if (key) { _ucStartInline(b, key); return; }
      if (selKey) { _ucStartSelect(b, selKey); return; }
      if (boolKey) {
        var patch = {};
        patch[boolKey] = !_ucVal(boolKey);
        _ucSend({ action: "set_settings", group: _viewMode, patch: patch });
        return;
      }
      if (act === "vmode") {
        var idx = _viewModes.indexOf(_viewMode);
        var nextVm = _viewModes[(idx + 1) % _viewModes.length];
        _setViewMode(nextVm);
        return;
      }
      if (act === "mode") { _ucSend({ action: "toggle_mode" }); return; }
      if (act === "log") { if (typeof _logToggle === "function") _logToggle(); return; }
      if (act === "rescan") { _ucSend({ action: "rescan", group: _viewMode }); return; }
      if (act === "auto") {
        var tgNow = _curTraderGroup();
        if (!tgNow.canTrade) return;
        _ucSend({ action: "set_auto", group: _viewMode, auto: !tgNow.auto });
      }
    });
  }

  window._ucRender = _ucRender;
  _ucRender();
})();

// ── Boot ──
window.onload = async function () {
  bootLog("Connecting to server: " + TICK_SERVER);
  var ok = await pollState();
  bootLog(ok ? ("Connected — Feed: " + srvState.feedState + " | Mode: " + (srvState.trader ? srvState.trader.mode.toUpperCase() : "DEMO")) : "Server waking up (retrying...)");
  syncActiveChartPairs();
  setInterval(pollState, 1000);
  setInterval(syncActiveChartPairs, 1000);
  setTimeout(function () {
    var o = document.getElementById("bootOverlay");
    if (o) o.style.display = "none";
  }, ok ? 350 : 1800);
};
</script>
</body>
</html>
